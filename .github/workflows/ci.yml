name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── native · sanitizers · tests ───────────────────────────────────────────
  # ASan and UBSan run on every push rather than being reached for once a bug
  # appears. -fno-sanitize-recover=all is what makes that meaningful: without
  # it UBSan prints a warning to a log nobody reads and the build stays green.
  native:
    name: native · ASan+UBSan · ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset native-debug -DPX_WERROR=ON

      - name: Build
        run: cmake --build --preset native-debug

      - name: Test
        run: ctest --preset native-debug

  # ── parser fuzzing ────────────────────────────────────────────────────────
  # The parser is the only component that consumes genuinely arbitrary input —
  # a user types into a box — so the hand-written cases cover the shapes I
  # thought of and this covers the ones I did not. Runs on Linux because
  # Apple's clang does not ship libFuzzer.
  fuzz:
    name: fuzz · parser · 60s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # ubuntu-latest defaults to GCC, which has no libFuzzer — so the link
      # probe in tests/CMakeLists.txt correctly skips the target and the run
      # step then fails on a missing binary. Ask for clang explicitly.
      - name: Configure
        run: cmake --preset fuzz -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build --preset fuzz

      # The probe is designed to skip silently, which is right for a local
      # build and wrong for CI: a fuzz job that quietly runs nothing is worse
      # than no fuzz job, because the green check implies coverage that does
      # not exist. Fail loudly instead.
      - name: Verify the fuzzer was actually built
        run: |
          if [ ! -x ./build/fuzz/tests/fuzz_parser ]; then
            echo "::error::fuzz_parser was not built — libFuzzer probe failed on a runner that should have it"
            exit 1
          fi

      - name: Fuzz
        run: ./build/fuzz/tests/fuzz_parser -max_total_time=60 -print_final_stats=1

      # A crash writes its reproducer to the working directory. Uploading it
      # means a CI failure arrives with the exact bytes that caused it.
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  # ── web · typecheck + build ───────────────────────────────────────────────
  # Builds the real wasm so the TypeScript is checked against the actual embind
  # surface rather than against a stub that can drift from it.
  web:
    name: web · tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.5 # must match scripts/bootstrap.sh
          actions-cache-folder: emsdk-cache

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build wasm
        run: ./scripts/build-wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web
