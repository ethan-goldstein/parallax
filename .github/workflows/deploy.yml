name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily, so the CelesTrak element-set snapshot the build embeds is never more
  # than a day old. See web/scripts/fetch-tle.mjs for why it is a snapshot at
  # all. Nothing else about the site changes on this schedule.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.5 # must match scripts/bootstrap.sh
          actions-cache-folder: emsdk-cache

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build engine (wasm, release)
        run: ./scripts/build-wasm.sh wasm-release

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Fail-soft by design: if CelesTrak does not answer, the script keeps
      # whatever snapshot exists and the client falls back to a live fetch.
      # A deploy that fails because a third party was down for a minute is
      # worse than a deploy carrying yesterday's element sets.
      - name: Fetch the element-set snapshot
        run: npm run build:tle
        working-directory: web

      - run: npm run build
        working-directory: web
        env:
          # The ADS-B relay's URL, from a repository variable. Unset means the
          # aviation layers report that no relay is configured. See relay/.
          VITE_ADSB_RELAY: ${{ vars.ADSB_RELAY }}

      # GitHub Pages serves 404.html for unknown paths. Copying index.html over
      # it makes client-side routing survive a hard refresh on a deep link,
      # which is the same trick used in ABROAD and Portfolio.
      - name: SPA fallback
        run: cp web/dist/index.html web/dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
